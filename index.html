<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111827">

    <title>Kointrol</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <div>
                <h1>💰 Kointrol</h1>
                <p>Hola, Juan 👋</p>
            </div>
        </header>


        <main>

            <section class="section">

                <h2>Mi dinero</h2>

                <div class="wallet">

                    <div class="wallet-icon">🏠</div>

                    <div class="wallet-info">
                        <span>Gastos fijos</span>
                        <strong id="fixedBalance">120,00 €</strong>
                    </div>

                </div>


                <div class="wallet">

                    <div class="wallet-icon">🏦</div>

                    <div class="wallet-info">
                        <span>Ahorro</span>
                        <strong id="savingBalance">250,00 €</strong>
                    </div>

                </div>


                <div class="wallet">

                    <div class="wallet-icon">📈</div>

                    <div class="wallet-info">
                        <span>Inversión</span>
                        <strong id="investmentBalance">180,00 €</strong>
                    </div>

                </div>

            </section>


            <section class="patrimony">

                <span>💎 Patrimonio</span>

                <strong id="patrimonyBalance">
                    430,00 €
                </strong>

                <small>
                    Ahorro + inversión
                </small>

            </section>


            <section class="actions">

                <button onclick="receiveMoney()">
                    💰
                    <span>Recibí dinero</span>
                </button>

                <button onclick="registerExpense()">
                    💸
                    <span>Registrar gasto</span>
                </button>

                <button onclick="addSaving()">
                    🏦
                    <span>Añadir ahorro</span>
                </button>

                <button onclick="addInvestment()">
                    📈
                    <span>Añadir inversión</span>
                </button>

                <button onclick="showDistribution()">
                    📊
                    <span>Distribución</span>
                </button>

                <button onclick="showGoals()">
                    🎯
                    <span>Mis metas</span>
                </button>

                <button onclick="showBadges()">
                    🏅
                    <span>Mis medallas</span>
                </button>

            </section>


            <section class="achievement">

                <div class="achievement-title">
                    🏅 Próximo logro
                </div>

                <div class="achievement-name">
                    Ahorro €500
                </div>

                <div class="progress">
                    <div class="progress-bar"></div>
                </div>

                <div class="progress-text">
                    250 € / 500 €
                </div>

            </section>

        </main>

    </div>


    <script src="app.js"></script>

</body>
</html>
